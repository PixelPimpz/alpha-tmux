# Gruvbox Dark Color Palette for Alpha-Tmux
# Naming follows: [theme]-alpha-tmux.yaml

theme: "gruvbox-dark"

palette:
  # Base Backgrounds
  bg: "#282828"
  bg_hard: "#1d2021"
  bg_soft: "#32302f"
  bg1: "#3c3836"
  bg2: "#504945"
  bg3: "#665c54"
  bg4: "#7c6f64"

  # Base Foregrounds & Grays
  fg: "#ebdbb2"
  fg_dim: "#a89984"
  gray: "#928374"

  # Accent Colors
  red: "#fb4934"
  green: "#b8bb26"
  yellow: "#fabd2f"
  gold: "#d79921"
  blue: "#83a598"
  purple: "#d3869b"
  aqua: "#8ec07c"
  cyan: "#689d6a"
  orange: "#fe8019"

ui:
  # Semantic UI Role Highlights
  header: "#d79921"      # Gold/Yellow for ASCII logo banner
  tagline: "#8ec07c"     # Aqua/Cyan for version & date tagline
  border: "#7c6f64"      # Muted gray for boxes border frames
  menu_key: "#fabd2f"    # Bright yellow for [key] shortcut brackets
  menu_text: "#ebdbb2"   # Main foreground for button labels
  menu_icon: "#83a598"   # Blue for button icons
  bracket: "#7c6f64"     # Muted gray for [ and ] brackets
  accent: "#fe8019"      # Orange for highlights
  prompt: "#fabd2f"      # Bright yellow for menu prompt
  muted: "#928374"       # Gray for section dividers
  success: "#b8bb26"     # Green for success status
  error: "#fb4934"       # Red for error alerts
