#settings menu
# choose theme
#
title: "Alpha Settings"
columns:
  - title: "Theme"
    buttons:
    - name: "Select Color Theme"
      icon: "color"
      comm: "$ACTIONS/select-theme.sh"

    - name: "Install Theme"
      icon: "infile"
      comm:

    - name: "Edit Color Theme"
      icon: "pencil"
      comm:

    - name: "Save Color Theme"
      icon: "floppy"
      comm:

  - title: "Behavior"
    buttons:
      - name: 'On Startup: $(get_option startup "[4 Options...]")'
        icon: "settings"
        comm: '$UTILS/profiler.sh step_option startup none last default menu'

      - name: "Default Proj: $(get_option defaultd)"
        icon: "folder-plus"
        if: '[[ "$(get_option startup)" == "default" ]]'
        comm: "$ACTIONS/to_project.sh --default"
