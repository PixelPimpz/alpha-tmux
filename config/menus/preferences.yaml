#settings menu
# choose theme
# 
title: "aTmux Prefs"
columns:
  - title: "Plugin Manager"
    buttons:
      - name: "Toggle Plugins..."
        icon: "plug"
        comm: "$ACTIONS/plugman.sh list"

      - name: "Install Plugin..."
        icon: "download"
        comm: "$ACTIONS/plugman.sh get_new"

      - name: "Update Plugins"
        icon: "update"
        comm: "$ACTIONS/plugman.sh update"

      - name: "Delete Plugin..."
        icon: "cancel"
        comm: "$ACTIONS/plugman.sh delete"

      - title: "Plugin Settings"
        buttons:
          - name: 'Wisdom: $(get_opt qotd source)'
            icon: "om"
            if: '[[ "$(get_opt qotd enabled ON)" == "ON" ]]'
            comm: '$UTILS/plugtools.sh step_opt qotd source dharma newage'
            stay: 1
