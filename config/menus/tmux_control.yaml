title: "TMUX Control"
columns:
  - title: "Tmux Control Center"
    buttons: 
    - name: "TPM Update..."
      icon: "update"
      comm: "$ACTIONS/tpm_update_interactive.sh" 

    - name: "TPM Update All"
      icon: "update"
      comm: "$ACTIONS/tpm-update.sh"
    
    - name: "Reload TMUX config"
      icon: "undo"
      comm: '$ACTIONS/reload-tmux.sh'

    - name: "TMUX Settings..."
      icon: "settings"
      comm: "$MENUS/tmux-preferences.yaml"
