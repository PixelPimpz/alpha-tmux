title: "Main Menu"
columns:
  - title: "Workspace"
    buttons:
      - name: "Load Session"
        icon: "new_session"
        key:  "l"
        comm: "tmux new-session"

      - name: "Load Project..."
        icon: "jump"
        key:  "p"
        popup: "m"
        comm: "$ACTIONS/to_project.sh" 

      - name: "Save Session"
        icon: "floppy"
        key:  "s"
        comm: "$ACTIONS/save_session.sh"

      - name: "Session Manager"
        icon: "submodule"
        key:  "S"
        popup: "m"
        comm: "$MENUS/session.yaml"


  - title: "TPM & Config"
    buttons:
      - name: "TPM Update..."
        icon: "update"
        key:  "u"
        comm: "$ACTIONS/tpm_update_interactive.sh" 

      - name: "TPM Update All"
        icon: "update"
        key:  "U"
        popup: "m"
        comm: "$ACTIONS/tpm-update.sh"

      - name: "Reload TMUX config"
        icon: "undo"
        key:  "r"
        comm: '$ACTIONS/reload-tmux.sh'

      - name: "Alpha Settings..."
        icon: "settings"
        key:  "A"
        comm: '$MENUS/preferences.yaml'

  - title: "Git Sync"
    buttons:
      - name: "Push to Remote"
        icon: "github"
        key:  "G"
        popup: "s"
        comm: "$ACTIONS/push.sh"

      - name: "Push all Projects"
        icon: "github"
        key:  "g"
        popup: "m"
        comm: "$ACTIONS/pushall.sh"

      - name: "Push Dotfiles"
        icon: "dotfiles"
        key:  "d"
        comm: "cd $DOTFILES && push"

      - name: "MOAR Git Stuff..."
        icon: "git"
        key:  "R"
        comm: "$ACTIONS/more_git.sh"

  - title: "Lifecycle"
    buttons:
      - name: "New NVIM Session"
        icon: "neovim"
        key:  "N"
        comm: "nvim"
      
      - name: "Kill Session"
        icon: "kill"
        key:  "k"
        comm: "tmux kill-session"
        
      - name: "Kill Server"
        icon: "kill"
        key:  "K"
        comm: "tmux kill-server"

