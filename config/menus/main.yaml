title: "Main Menu"
columns:
  - title: "Workspace"
    buttons:
      - name: "Load Session..."
        icon: "new_session"
        comm: "$ACTIONS/load_session.sh"

      - name: "Load Project..."
        icon: "jump"
        comm: "$ACTIONS/to_project.sh" 

      - name: "Save Session"
        icon: "floppy"
        comm: "$ACTIONS/save_session.sh"

  - title: "Controls"
    buttons:
      - name: "Session Manager..."
        icon: "submodule"
        comm: "$MENUS/session.yaml"

      - name: "TMUX Control..."
        icon: "tmux"
        comm: '$MENUS/tmux_control.yaml'

      - name: "Git Control..."
        icon: "git"
        comm: "$MENUS/git_control.yaml"

      - name: "System Control..."
        icon: "gear"
        comm: '$MENUS/syscontrol.yaml'

  - title: "Lifecycle"
    buttons:
      - name: "New NVIM Session"
        icon: "neovim"
        if: "command -v nvim"
        alt: "dimmed"
        comm: "nvim"

      - name: "New AI Session"
        icon: "ai" 
        comm: "ac; agy"
      
      - name: "Kill Session"
        icon: "kill"
        comm: "tmux kill-session"
        
      - name: "Kill Server"
        icon: "kill"
        comm: "tmux kill-server"

