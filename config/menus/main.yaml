title: "Main Menu"
columns:
  - title: "Workspace"
    buttons:
      - name: "Load Session..."
        icon: "new_session"
        key:  "a"
        comm: "$ACTIONS/load_session.sh"

      - name: "Load Project..."
        icon: "jump"
        key:  "b"
        popup: "m"
        comm: "$ACTIONS/to_project.sh" 

      - name: "Save Session"
        icon: "floppy"
        key:  "c"
        comm: "$ACTIONS/save_session.sh"

      - name: "Session Manager"
        icon: "submodule"
        key:  "d"
        popup: "m"
        comm: "$MENUS/session.yaml"


  - title: "TPM & Config"
    buttons:
      - name: "TPM Update..."
        icon: "update"
        key:  "e"
        comm: "$ACTIONS/tpm_update_interactive.sh" 

      - name: "TPM Update All"
        icon: "update"
        key:  "f"
        popup: "m"
        comm: "$ACTIONS/tpm-update.sh"

      - name: "TMUX Control..."
        icon: "tmux"
        key:  "g"
        comm: '$MENUS/tmux_control.yaml'

      - name: "aTMUX Preferences..."
        icon: "settings"
        key:  "h"
        comm: '$MENUS/preferences.yaml'

  - title: "Git Sync"
    buttons:
      - name: "Push to Remote"
        icon: "github"
        key:  "i"
        popup: "s"
        comm: "$ACTIONS/push.sh"

      - name: "Push all Projects"
        icon: "github"
        key:  "j"
        popup: "m"
        comm: "$ACTIONS/pushall.sh"

      - name: "Push Dotfiles"
        icon: "dotfiles"
        key:  "k"
        comm: "cd $DOTFILES && push"

      - name: "MOAR Git Stuff..."
        icon: "git"
        key:  "l"
        comm: "$ACTIONS/more_git.sh"

  - title: "Lifecycle"
    buttons:
      - name: "New NVIM Session"
        icon: "neovim"
        key:  "m"
        comm: "nvim"
      
      - name: "Kill Session"
        icon: "kill"
        key:  "n"
        comm: "tmux kill-session"
        
      - name: "Kill Server"
        icon: "kill"
        key:  "o"
        comm: "tmux kill-server"

