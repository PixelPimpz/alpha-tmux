title: "Main Menu"
columns:
  - title: "Workspace"
    buttons:
      - name: "Load Session..."
        icon: "new_session"
        key:  "a"
        comm: "$ACTIONS/load_session.sh"

      - name: "Load Project..."
        icon: "jump"
        key:  "b"
        popup: "m"
        comm: "$ACTIONS/to_project.sh" 

      - name: "Save Session"
        icon: "floppy"
        key:  "c"
        comm: "$ACTIONS/save_session.sh"

      - name: "Session Manager"
        icon: "submodule"
        key:  "d"
        popup: "m"
        comm: "$MENUS/session.yaml"

  - title: "Controls"
    buttons:
      - name: "TMUX Control..."
        icon: "tmux"
        key:  "g"
        comm: '$MENUS/tmux_control.yaml'

      - name: "aTMUX Preferences..."
        icon: "settings"
        key:  "h"
        comm: '$MENUS/preferences.yaml'

      - name: "Git Control..."
        icon: "git"
        key:  "i"
        comm: "$ACTIONS/more_git.sh"

      - name: "System Control..."
        icon: "gear"
        key:  "j"
        comm: '$MENUS/preferences.yaml'

  - title: "Git Sync"
    buttons:
      - name: "Push to Remote"
        icon: "github"
        key:  "k"
        popup: "s"
        comm: "$ACTIONS/push.sh"

      - name: "Push all Projects"
        icon: "github"
        key:  "l"
        popup: "m"
        comm: "$ACTIONS/pushall.sh"

      - name: "Push Dotfiles"
        icon: "dotfiles"
        key:  "m"
        comm: "cd $DOTFILES && push"

  - title: "Lifecycle"
    buttons:
      - name: "New NVIM Session"
        icon: "neovim"
        key:  "n"
        comm: "nvim"
      
      - name: "Kill Session"
        icon: "kill"
        key:  "o"
        comm: "tmux kill-session"
        
      - name: "Kill Server"
        icon: "kill"
        key:  "p"
        comm: "tmux kill-server"

