title: "Sessions"
columns:
  - title: "Management"
    buttons:
      - name: "Load Session"
        icon: "infile"
        key:  "1"
        comm: "$ACTIONS/load_session.sh"

      - name: "Save Session"
        icon: "floppy"
        key:  "2"
        comm: "$ACTIONS/save_session.sh"

      - name: "Save Session as..."
        icon: "floppy"
        key:  "3"
        comm: "$ACTIONS/save_session.sh --as"

      - name: "Delete Session"
        icon: "cancel"
        key:  "4"
        comm: "$ACTIONS/delete_session.sh"

  - title: "Control"
    buttons:
      - name: "New Session"
        icon: "new_session"
        key:  "5"
        comm: "tmux new-session"

      - name: "Rename Session"
        icon: "rename"
        key:  "6"
        comm: "$ACTIONS/rename_session.sh"

      - name: "Detach from Session"
        icon: "pause"
        key:  "7"
        comm: "tmux detach-client"

      - name: "Kill Session"
        icon: "kill"
        key:  "8"
        comm: "tmux kill-session"

      - name: "Kill Server"
        icon: "kill"
        key:  "9"
        comm: "tmux kill-server"

