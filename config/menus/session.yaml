title: "Sessions"
columns:
  - title: "Management"
    buttons:
      - name: "New Session"
        icon: "new_session"
        comm: "tmux new-session"

      - name: "Load Session"
        icon: "infile"
        comm: "$ACTIONS/load_session.sh"

      - name: "Save Session"
        icon: "floppy"
        comm: "$ACTIONS/save_session.sh"

      - name: "Save Session as..."
        icon: "floppy"
        comm: "$ACTIONS/save_session.sh --as"

      - name: "Rename Session"
        icon: "rename"
        comm: "$ACTIONS/rename_session.sh"

      - name: "Delete Session"
        icon: "cancel"
        comm: "$ACTIONS/delete_session.sh"

  - title: "Control"
    buttons:
      - name: "Detach from Session"
        icon: "pause"
        comm: "tmux detach-client"

      - name: "Kill Session"
        icon: "kill"
        comm: "tmux kill-session"

      - name: "Kill Server"
        icon: "kill"
        comm: "tmux kill-server"

  - title: "Look & Feel"
    buttons:
      - name: "Color Themes..." 
        icon: "color"
        comm: "$ACTIONS/select-theme.sh"

      - name: 'On Startup: $(get_option startup "[4 Options...]")'
        icon: "settings"
        comm: '$UTILS/profiler.sh step_option startup none last default menu'
        stay: 1

      - name: "Default Proj: $(get_option defaultd)"
        icon: "folder-plus"
        if: '[[ "$(get_option startup)" == "default" ]]'
        comm: "$ACTIONS/to_project.sh --default"
