title: "Sessions"
columns:
  - title: "Management"
    buttons:
      - name: "Load Session"
        icon: "infile"
        key:  "l"
        comm: "$ACTIONS/load_session.sh"

      - name: "Save Session"
        icon: "floppy"
        key:  "s"
        comm: "$ACTIONS/save_session.sh"

      - name: "Save Session as..."
        icon: "floppy"
        key:  "S"
        comm: "$ACTIONS/save_session.sh --as"

      - name: "Delete Session"
        icon: "cancel"
        key:  "d"
        comm: "$ACTIONS/delete_session.sh"

  - title: "Control"
    buttons:
      - name: "New Session"
        icon: "new_session"
        key:  "n"
        comm: "tmux new-session"

      - name: "Rename Session"
        icon: "rename"
        key:  "r"
        comm: "$ACTIONS/rename_session.sh"

      - name: "Detach from Session"
        icon: "pause"
        key:  "D"
        comm: "tmux detach-client"

      - name: "Kill Session"
        icon: "kill"
        key:  "k"
        comm: "tmux kill-session"

      - name: "Kill Server"
        icon: "kill"
        key:  "K"
        comm: "tmux kill-server"

