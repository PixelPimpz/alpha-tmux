# ===================================================================== #
# syscontrol.yaml
# Quit to Desktop 
# Save (session) + Quit to Desktop 
# Logout current user 
# Restart System
# Run full system update (use package manager in preferences)
# Install package(s) 
#
# ===================================================================== #
title: "System Control"
columns:
  - title: "System"
    buttons:
      - name: "Desktop Logout"
        icon: "logout"
        comm: "$ACTIONS/syscontrol.sh logout"

      - name: "System Reboot"
        icon: "restart"
        comm: "$ACTIONS/syscontrol.sh reboot"

      - name: "Reboot to EFI/BIOS"
        icon: "chip"
        comm: "$ACTIONS/syscontrol.sh bios"

      - name: "Soft System Reboot"
        icon: "restart"
        comm: "$ACTIONS/syscontrol.sh soft-reboot"
