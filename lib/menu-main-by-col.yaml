column00:
  - name: "New Session"
    icon: "new_session"
    key:  "s"
    comm: "tmux new-session"
  - name: "New Window"
    icon: "new_window"
    key:  "c"
    comm: "tmux new-window"
  - name: "Launch Neovim"
    icon: "neovim"
    key:  "N"
    comm: "/usr/local/bin/nvim"
column01:
  - name: "TPM Update All"
    icon: "update"
    key:  "U"
    comm: "$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/update-plugins"
  - name: "TPM Update"
    icon: "update"
    key:  "u"
    comm: #"$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/update-plugins"
  - name: "Reload Config"
    icon: "undo"
    key:  "r"
    comm: 'tmux source-file "$HOME/.tmux.conf" ; tmux display "Config Reloaded"'
column02:
  - name: "Push to Remote"
    icon: "git"
    key:  "p"
    comm: "$SCRIPTS/push"
  - name: "Push all Projects"
    icon: "git"
    key:  "P"
    comm: "$ACTIONS/pushallpro.sh"
  - name: "Push Dotfiles"
    icon: "dotfiles"
    key:  "d"
    comm: "cd $DOTFILES && push"
column003:
  - name: "Detach Session"
    icon: "pause"
    key:  "D"
    comm: "tmux detach-client"
  - name: "Kill Session"
    icon: "kill"
    key:  "k"
    comm: "tmux kill-session"
  - name: "Kill Server"
    icon: "kill"
    key:  "K"
    comm: "tmux kill-server"
