
columns:
  - title: "Workspace"
    buttons:
      - name: "New Session"
        icon: "new_session"
        key:  "s"
        comm: "tmux new-session"
      - name: "Attach Session"
        icon: "history"
        key:  "a"
        comm: "session-attach.sh"
      - name: "Edit Session"
        icon: "edit_session"
        key:  "e"
        comm: "session-edit.sh"
      - name: "Save Session"
        icon: "floppy"
        key:  "S"
        comm: "$ACTIONS/session-save.sh"
  - title: "TPM & Config"
    buttons:
      - name: "TPM Update..."
        icon: "update"
        key:  "u"
        comm: "$ACTIONS/tpm_update_interactive.sh" # placeholder
      - name: "TPM Update All"
        icon: "update"
        key:  "U"
        comm: "$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/update-plugins"
      - name: "Reload TMUX config"
        icon: "undo"
        key:  "r"
        comm: "tmux source-file $TMUX_CONFIG"
  - title: "Git Sync"
    buttons:
      - name: "Push to Remote"
        icon: "git"
        key:  "p"
        comm: "$SCRIPTS/push"
      - name: "Push all Projects"
        icon: "git"
        key:  "P"
        comm: "$ACTIONS/pushallpro.sh"
      - name: "Push Dotfiles"
        icon: "dotfiles"
        key:  "d"
        comm: "cd $DOTFILES && push"
  - title: "Lifecycle"
    buttons:
      - name: "Detach Session"
        icon: "pause"
        key:  "D"
        comm: "tmux detach-client"
      - name: "Kill Session"
        icon: "kill"
        key:  "k"
        comm: "tmux kill-session"
      - name: "Kill Server"
        icon: "kill"
        key:  "K"
        comm: "tmux kill-server"
