
Buttons:
  - name: "Reload Config"
    icon: "undo"
    key:  "r"
    comm: 'tmux source-file "$HOME/.tmux.conf" ; tmux display "Config Reloaded"'
  - name: "New Session"
    icon: "new_session"
    key:  "s"
    comm: "tmux new-session"
  - name: "Detach Session"
    icon: "pause"
    key:  "D"
    comm: "tmux detach-client"
  - name: "Kill Session"
    icon: "tick"
    key:  "s"
    comm: "tmux session-kill"
  - name: "TPM Update All"
    icon: "update"
    key:  "U"
    comm: "$TMUX_PLUGIN_MANAGER_PATH/tpm/bin/update-plugins"
  - name: "Launch Neovim"
    icon: "neovim"
    key:  "N"
    comm: "/usr/local/bin/nvim"
  - name: "Push to GitHub"
    icon: "github"
    key:  "p"
    comm: "$SCRIPTS/push"
  - name: "Push all Projects"
    icon: "git"
    key:  "P"
    comm: "$ACTIONS/pushallpro.sh"
  - name: "Push Dotfiles"
    icon: "dotfiles"
    key:  "d"
    comm: "cd $DOTFILES && push"
