
Buttons:
  - name: "Reload Config"
    icon: "undo"
    key:  "r"
    comm: "source $HOME/.tmux.conf"
  - name: "New Session"
    icon: "new_session"
    key:  "s"
    comm: "tmux new-session"
  - name: "Detach Session"
    icon: "pause"
    key:  "d"
    comm: "tmux detach-client"
  - name: "Kill Session"
    icon: "tick"
    key:  "s"
    comm: "tmux session-kill"
  - name: "TPM Update All"
    icon: "update"
    key:  "U"
    comm: "tbd"
